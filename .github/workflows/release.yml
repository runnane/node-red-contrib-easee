# Cut a release: bump the version, tag it, publish to npm, create the GitHub release (EASEE-16).
#
# Triggered by hand from the Actions tab ("Release" → "Run workflow"). Nothing
# here runs on push, so merging to main never releases anything by itself.
#
# ⚠️ THE FILENAME IS LOAD-BEARING. npm's trusted publisher for
# @runnane/node-red-contrib-easee is bound to `release.yml` in this repository.
# Renaming this file makes every publish fail with an auth error, and nothing in
# the repo can tell you why. tests/unit/release-workflow.test.ts pins it.
#
# Three jobs, each doing one thing, so a failure part-way through is recoverable
# with "Re-run failed jobs" rather than a second version bump:
#
#   prepare         gates + audit on the exact commit, `npm version`, check the
#                   packed tarball loads in Node-RED, upload the built dist/,
#                   push commit + tag to main
#   publish         check out the TAG, add the dist/ prepare built and checked,
#                   `npm publish` over OIDC — skipped if that version is already on npm
#   github-release  `gh release create` with generated notes — skipped if it exists
#
# Since EASEE-19 the package is its BUILD (dist/easee-client/, gitignored), not its
# source. The publish job still installs nothing and runs no package scripts: it
# publishes the exact dist/ that passed the gates and the load check in prepare,
# handed over as an artifact, and refuses to publish if any node file is missing.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: Dry run — gate, bump and pack, but do not push, publish or create a release
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, and never cancel one half-way: a cancelled run can
# leave a pushed tag with nothing published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Gate, bump and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
    - name: Refuse a real release from anywhere but main
      if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
      run: |
        echo "::error::A release can only be cut from main; this run is on ${GITHUB_REF}. Dry runs work from any branch."
        exit 1

    # The release job gates on one Node version; the 22/24/26 test matrix, the
    # 18/20/22/24 packed-tarball compat matrix and the audit already ran on this
    # commit when it was pushed to main. Refuse to release a commit where they did
    # not pass.
    - name: Refuse a commit whose CI is not green
      if: ${{ !inputs.dry_run }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        read -r status conclusion < <(gh api \
          "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=1" \
          --jq '.workflow_runs[0] | "\(.status // "none") \(.conclusion // "none")"')
        echo "CI on ${GITHUB_SHA}: status=${status} conclusion=${conclusion}"
        if [ "$conclusion" != "success" ]; then
          echo "::error::CI on ${GITHUB_SHA} is not green (status=${status}, conclusion=${conclusion}). Wait for it, or fix main first. A commit made by a previous release has no CI run of its own; merge something first or release from the commit before it."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Full history and every tag, so `npm version` refuses a tag that already exists.
        fetch-depth: 0
        # No token left in .git/config while dependency install scripts and tests
        # run. The push step supplies it for that one command.
        persist-credentials: false

    # Before setup-node: its `cache: pnpm` needs the pnpm binary. The pnpm version
    # comes from `packageManager` in package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    # 22.x: the toolchain (Vitest 5) needs >= 22.12.
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run the gates
      run: pnpm gates

    - name: Audit production dependencies
      run: pnpm audit:prod

    # `npm version`, not pnpm: it only rewrites package.json's version, commits and
    # tags — pnpm-lock.yaml carries no root version — and it is what cut every
    # release before this workflow.
    - name: Bump the version
      id: bump
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Same shape as every release before this workflow: a commit titled
        # "0.7.5" and an annotated tag "v0.7.5".
        npm version "$BUMP" --message "%s"
        version=$(node -p "require('./package.json').version")
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "tag=v${version}" >> "$GITHUB_OUTPUT"
        git log --oneline -1
        git tag --points-at HEAD

    # The same check as the Node-RED Compatibility job in ci.yml, on the tarball
    # with the bumped version in it: pack (prepack rebuilds dist/), install it
    # somewhere else with npm — the palette's installer — and load every node from
    # there.
    - name: Pack the package
      run: pnpm pack --pack-destination "$RUNNER_TEMP"

    - name: Install the packed tarball
      run: npm install --prefix "$RUNNER_TEMP/compat" --no-package-lock "$RUNNER_TEMP"/runnane-node-red-contrib-easee-*.tgz

    - name: Test Node-RED compatibility of the packed package
      run: node dist/scripts/check-node-loads.js --package-dir "$RUNNER_TEMP/compat/node_modules/@runnane/node-red-contrib-easee"

    # Hand the publish job exactly the build that just passed the gates and the
    # load check, so it never has to install or build anything itself. Kept after
    # the push too: "Re-run failed jobs" on publish downloads it again.
    - name: Upload the built package
      uses: actions/upload-artifact@v7
      with:
        name: dist-easee-client
        path: dist/easee-client/
        if-no-files-found: error
        retention-days: 7

    # --atomic: the commit and the tag land together or not at all. If main moved
    # while this ran, the push is rejected as non-fast-forward and nothing is
    # released — re-run the workflow so the gates see the new main.
    - name: Push the version commit and tag
      if: ${{ !inputs.dry_run }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.bump.outputs.tag }}
      run: |
        git push --atomic \
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          "HEAD:refs/heads/main" "refs/tags/${TAG}"

    - name: Summary
      env:
        TAG: ${{ steps.bump.outputs.tag }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        if [ "$DRY_RUN" = "true" ]; then
          echo "### Dry run: would release \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Gates, audit and the packed-tarball load check passed. Nothing was pushed or published." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### Tagged \`${TAG}\` on main" >> "$GITHUB_STEP_SUMMARY"
        fi

  publish:
    name: Publish to npm
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Optional protection point: add required reviewers to this environment in
    # Settings → Environments to make every publish wait for an approval.
    environment: npm
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this job's OIDC token for a short-lived
      # publish credential. There is deliberately no NPM_TOKEN secret, and
      # provenance is attached to the published version automatically.
      id-token: write

    steps:
    - name: Checkout the tag
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.tag }}
        persist-credentials: false

    # dist/ is gitignored, so the tag does not contain the package. Add the build
    # prepare gated and load-checked on this same version.
    - name: Add the built package
      uses: actions/download-artifact@v8
      with:
        name: dist-easee-client
        path: dist/easee-client

    # Trusted publishing needs npm 11.5.1 or newer; Node 24 bundles npm 11.
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: 'https://registry.npmjs.org'

    - name: Check the tag and the npm version
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        actual=$(node -p "require('./package.json').version")
        if [ "$actual" != "$VERSION" ]; then
          echo "::error::The tag holds version ${actual}, but prepare bumped to ${VERSION}."
          exit 1
        fi
        npm_version=$(npm --version)
        echo "npm ${npm_version}"
        # sort -C succeeds only if the lines are already in order, i.e. 11.5.1 <= npm_version.
        if ! printf '%s\n' 11.5.1 "$npm_version" | sort -V -C; then
          echo "::error::npm ${npm_version} cannot publish with OIDC; 11.5.1 or newer is required."
          exit 1
        fi

    # A publish without dist/ would ship a package that installs and then loads no
    # nodes — to every user, with nothing in this workflow going red. So check
    # every file package.json's node-red block names, and its .html editor half.
    - name: Check the built package is complete
      run: |
        node -e '
          const fs = require("fs");
          const nodes = require("./package.json")["node-red"].nodes;
          const files = Object.values(nodes).flatMap((f) => [f, f.replace(/\.js$/, ".html")]);
          const missing = files.filter((f) => !fs.existsSync(f));
          if (files.length === 0 || missing.length > 0) {
            console.log("::error::The package to publish is incomplete; missing: " + missing.join(", "));
            process.exit(1);
          }
          console.log("Complete: " + files.join(", "));
        '

    # No install, and --ignore-scripts: `prepack` (pnpm build) must not run here —
    # there are no dependencies to build with, dist/ is already the gated build,
    # and nothing third-party runs in the one job that holds a publish credential.
    - name: Publish
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        name=$(node -p "require('./package.json').name")
        if npm view "${name}@${VERSION}" version > /dev/null 2>&1; then
          echo "::notice::${name}@${VERSION} is already on npm; nothing to publish."
          exit 0
        fi
        npm publish --access public --ignore-scripts
        echo "### Published \`${name}@${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub release
    needs: [prepare, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "::notice::Release ${TAG} already exists; nothing to create."
          exit 0
        fi
        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
        echo "### Created GitHub release \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
