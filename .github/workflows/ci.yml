name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run ESLint with detailed output
      if: failure()
      run: npm run lint -- --format=unix

    - name: Run tests
      if: matrix.node-version != '20.x'
      run: npm test

    # One matrix leg runs with coverage so the thresholds in jest.config.js are
    # actually enforced in CI. Without this the thresholds are never evaluated
    # and can only ever be decorative.
    - name: Run tests with coverage
      if: matrix.node-version == '20.x'
      run: npm run test:coverage

    - name: Upload coverage report
      if: matrix.node-version == '20.x' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14

  compatibility-check:
    runs-on: ubuntu-latest
    name: Node-RED Compatibility

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Check the artifact users actually install, not the working tree: pack the
    # package, install the tarball somewhere else, and load every node from
    # there into a real Node-RED runtime. This catches both a node that fails to
    # register and a file that .npmignore drops from the published package.
    - name: Pack the package
      run: npm pack --pack-destination "$RUNNER_TEMP"

    - name: Install the packed tarball
      run: npm install --prefix "$RUNNER_TEMP/compat" --no-package-lock "$RUNNER_TEMP"/runnane-node-red-contrib-easee-*.tgz

    - name: Test Node-RED compatibility of the packed package
      run: npm run test:compat -- --package-dir "$RUNNER_TEMP/compat/node_modules/@runnane/node-red-contrib-easee"

  security-audit:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    # Blocking: only the dependencies that actually ship to npm consumers.
    # A plain `npm audit` fails on devDependency advisories that never reach a
    # user, which is why this job was red on main continuously for a year and
    # why nobody read its output. Known advisories are accepted explicitly, with
    # a reason and a tracking issue, in the ALLOWLIST in the script.
    - name: Audit production dependencies
      run: npm run audit:prod

    # Informational: the full tree, including dev tooling. Never blocking —
    # dependabot is already configured and is the right tool for these, since it
    # opens a PR per bump instead of failing an unrelated build.
    - name: Audit all dependencies (informational)
      run: npm audit --audit-level=moderate || true

    - name: Check for outdated packages
      run: npm outdated || true
