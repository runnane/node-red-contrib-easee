name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# pnpm/action-setup must run BEFORE actions/setup-node in every job: setup-node's
# `cache: pnpm` looks for the pnpm binary to find its store, and fails without it.
# action-setup reads the pnpm version from `packageManager` in package.json, so
# there is no version to keep in sync here.

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Vitest 5 requires Node ^22.12 || ^24 || >=26, so the test legs start at
        # 22. The published package still claims Node >=18 — that claim is checked
        # by the Node-RED Compatibility job below, which needs no test runner.
        node-version: [22.x, 24.x, 26.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # The same gate an agent or a human runs locally: biome check, typecheck,
    # build, vitest WITH the coverage thresholds, and the Node-RED load check
    # against dist/. Every leg runs the whole thing — coverage is not left to one
    # leg, so the thresholds in vitest.config.mts can never be decorative.
    - name: Run gates
      run: pnpm gates

    - name: Upload coverage report
      if: matrix.node-version == '24.x' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14

  compatibility-check:
    runs-on: ubuntu-latest
    name: Node-RED Compatibility (Node ${{ matrix.node-version }})

    strategy:
      matrix:
        # Every Node version `engines` claims. The build targets ES2022, which
        # Node 18 runs, but nothing else in CI runs on 18 or 20 — Vitest and the
        # TypeScript toolchain do not support them — so this is the only evidence
        # behind ">=18.0.0". If a leg here goes red, the claim is false.
        node-version: [18.x, 20.x, 22.x, 24.x]

    # Build and pack on Node 22 (the toolchain needs it), then switch Node to the
    # matrix version for the consumer install and the load. One job per leg with a
    # second setup-node step is simpler than passing a tarball and dist/scripts
    # between jobs as artifacts, and the load step still resolves node-red and
    # node-red-node-test-helper from this checkout's node_modules.
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js 22.x to build
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Check the artifact users actually install, not the working tree: pack the
    # package, install the tarball somewhere else, and load every node from
    # there into a real Node-RED runtime. This catches both a node that fails to
    # register and a file the `files` allowlist leaves out of the published
    # package. `pnpm pack` runs `prepack`, which builds dist/.
    - name: Pack the package
      run: pnpm pack --pack-destination "$RUNNER_TEMP"

    - name: Use Node.js ${{ matrix.node-version }} to load
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # npm, not pnpm, on purpose: the Node-RED palette manager installs contributed
    # nodes with npm, so this is the node_modules layout a user actually gets.
    - name: Install the packed tarball
      run: npm install --prefix "$RUNNER_TEMP/compat" --no-package-lock "$RUNNER_TEMP"/runnane-node-red-contrib-easee-*.tgz

    - name: Test Node-RED compatibility of the packed package
      run: node dist/scripts/check-node-loads.js --package-dir "$RUNNER_TEMP/compat/node_modules/@runnane/node-red-contrib-easee"

  security-audit:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    # pnpm audit reads the lockfile, but the audit script itself is TypeScript and
    # runs from dist/scripts/, so it has to be installed and built first.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    # Blocking: only the dependencies that actually ship to consumers.
    # A plain audit fails on devDependency advisories that never reach a user,
    # which is why this job was red on main continuously for a year and
    # why nobody read its output. Known advisories are accepted explicitly, with
    # a reason and a tracking issue, in the ALLOWLIST in the script.
    - name: Audit production dependencies
      run: pnpm audit:prod

    # Informational: the full tree, including dev tooling. Never blocking —
    # dependabot is already configured and is the right tool for these, since it
    # opens a PR per bump instead of failing an unrelated build.
    - name: Audit all dependencies (informational)
      run: pnpm audit --audit-level=moderate || true

    - name: Check for outdated packages
      run: pnpm outdated || true
