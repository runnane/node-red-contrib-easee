# Dependabot configuration for node-red-contrib-easee
# This file enables automatic dependency updates via GitHub Dependabot

version: 2
updates:
  # Enable updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    # Automatically merge minor and patch updates
    open-pull-requests-limit: 10
    # Group updates by type
    groups:
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "@types/*"
          - "vitest"
          - "@vitest/*"
          - "@biomejs/*"
          - "typescript*"
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "vitest"
          - "@vitest/*"
          - "@biomejs/*"
          - "typescript*"
    # Commit message configuration
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Reviewers for dependency PRs
    reviewers:
      - "runnane"
    # Labels to add to PRs
    labels:
      - "dependencies"
      - "automated"
    # Ignore specific packages if needed
    ignore:
      # Ignore major version updates for stable dependencies
      - dependency-name: "node-red"
        update-types: ["version-update:semver-major"]
      # Example: ignore specific packages
      # - dependency-name: "package-name"
      #   versions: ["1.x", "2.x"]
    # Target branch for PRs (defaults to default branch)
    target-branch: "main"
    # Allow Dependabot to rebase PRs
    rebase-strategy: "auto"

  # Keep GitHub Actions themselves current (EASEE-23) — ci.yml and release.yml
  # pin actions by major tag, and GitHub Actions runners have started forcing
  # actions still targeting the deprecated Node 20 runtime onto Node 24 with a
  # warning; a version bump here is how future warnings arrive as a PR instead
  # of as a silent annotation nobody reads until the fallback is removed.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
